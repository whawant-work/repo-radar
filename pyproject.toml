[project]
name = "repo-radar"
version = "0.1.0"
description = "Daily digest of your GitHub universe — PRs, issues, and reviews."
readme = "README.md"
license = {text = "THE WHATWANT BEERWARE LICENSE (Version 1.0)"}
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.ruff]
# Formatting and linting tool (formatter replaces Black; linter replaces flake8/isort)
line-length = 100
target-version = "py312"
extend-exclude = [
	".venv",
	".env",
	"build",
	"dist",
]

[tool.ruff.format]
# Black-like formatting, normalized to double quotes
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
# Rule sets: E/W (pycodestyle), F (pyflakes), I (isort),
# B (bugbear), UP (pyupgrade), N (pep8-naming), A (builtins)
select = ["E", "W", "F", "I", "B", "UP", "N", "A"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["repo_radar"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-builtins]
# Commonly-used identifiers allowed even if they shadow builtins (use sparingly)
builtins-ignorelist = ["id", "type"]
